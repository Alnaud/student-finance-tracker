<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student finance tracker</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <h1>The student finance tracker</h1>
        <nav aria-label="Main navigation">
        
          <ul>
        
                <li><a href="#about">About</a></li>
                <li><a href="#dashboard">dashboard</a></li>
                <li><a href="#records">records</a></li>
                <li><a href="#form">form</a></li>
                <li><a href="#settings">settings</a></li>
            
            
        </ul>
        </nav>
    </header>
    <main id="main">
        <section id="about">
            <h2>about</h2>
            <p>this is the about page</p>
        </section>

        <section id="dashboard">
            <h2>dashboard</h2>
            <p>this is the dashboard page</p>
        </section>

        <section id="form">
            <h2>form</h2>

            <form id="txn-form" novalidate>
        <label for="description">Description</label>
<input type="text" id="description" name="description">
<p id="description-error"></p>

<label for="amount">Amount</label>
<input type="text" id="amount" name="amount" inputmode="decimal">
<p id="amount-error"></p>

<label for="category">Category</label>
<input type="text" id="category" name="category">
<p id="category-error"></p>

<label for="date">Date</label>
<input type="text" id="date" name="date" placeholder="YYYY-MM-DD">
<p id="date-error"></p>

<button type="submit">Add transaction</button>
<div id="form-status" role="status" aria-live="polite"></div>

    </form>
        </section>

        <section id="settings">
            <h2>settings</h2>
        </section>

        <section id="records">
            <h2>records</h2>
        </section>
    </main>
    

</body>
</html>
